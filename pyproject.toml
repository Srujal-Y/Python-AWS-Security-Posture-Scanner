[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-posture-scanner"
version = "1.0.0"
description = "Read-only AWS security posture checks with locally reviewed reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["boto3>=1.43.115,<2", "jsonschema>=4.26,<5"]

[project.scripts]
aws-posture = "posture_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
posture_scanner = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".wheel-smoke"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
