name: Validate scanner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-build-isolation --no-deps
          python -m pip check
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test checks, AWS stubs, input contracts and reports
        run: >-
          python -m pytest --cov=posture_scanner --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-fail-under=90
          --junitxml=reports/junit.xml
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict --disable-pip --no-deps
      - name: Build distributable
        run: python -m build --no-isolation
      - name: Smoke test installed wheel
        shell: bash
        run: |
          python -m pip uninstall -y aws-posture-scanner
          python -m pip install dist/*.whl --no-deps
          cd "$RUNNER_TEMP"
          aws-posture demo --output "$GITHUB_WORKSPACE/reports/demo" --fail-on none
      - name: Upload test evidence and fictional demo only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanner-validation-python-${{ matrix.python }}
          path: |
            coverage.xml
            reports/junit.xml
            reports/demo/
            dist/
          retention-days: 14
          if-no-files-found: warn
